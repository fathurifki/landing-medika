upstream landing_upstream {
  server srv-captain--landing:4321;
}

upstream dashboard_upstream {
  server srv-captain--dashboard:3000;
}

upstream backend_upstream {
  server srv-captain--backend:3001;
}

server {
  listen 80;
  client_max_body_size 60m;

  # CapRover's own nginx terminates TLS and forwards plain HTTP here,
  # but it sets X-Forwarded-Proto with the original scheme — pass it
  # through instead of hardcoding $scheme (which would always be "http").
  set $forwarded_proto $http_x_forwarded_proto;
  if ($forwarded_proto = '') {
    set $forwarded_proto $scheme;
  }

  location = /dashboard {
    proxy_pass http://dashboard_upstream/dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location /dashboard/ {
    proxy_pass http://dashboard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location = /api {
    proxy_pass http://backend_upstream/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location = /files {
    proxy_pass http://backend_upstream/files;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location /files/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }

  location / {
    proxy_pass http://landing_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;
  }
}
